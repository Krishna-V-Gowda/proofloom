[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "proofloom"
version = "1.0.0"
description = "Verification-first settlement close: AI ranks ambiguity; deterministic controls own financial truth."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Krishna V. Gowda" }]
keywords = ["fintech", "reconciliation", "auditability", "human-in-the-loop", "reliability"]
dependencies = [
  "fastapi>=0.128,<0.129",
  "httpx>=0.28,<0.29",
  "matplotlib>=3.10,<3.11",
  "numpy>=2.3,<2.4",
  "pydantic>=2.13,<2.14",
  "scikit-learn>=1.8,<1.9",
  "uvicorn>=0.48,<0.49",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[project.scripts]
proofloom = "proofloom.cli:main"

[project.urls]
Repository = "https://github.com/Krishna-V-Gowda/proofloom"
Documentation = "https://github.com/Krishna-V-Gowda/proofloom/tree/main/docs"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
proofloom = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
addopts = "-ra -q -p no:cacheprovider"
testpaths = ["tests"]
